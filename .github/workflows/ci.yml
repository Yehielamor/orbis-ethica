name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      - name: Syntax and error check
        run: ruff check backend sdk tests scenarios data_factory --select=E9,F63,F7,F82 --exclude "**/venv/**"
